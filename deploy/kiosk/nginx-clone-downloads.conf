# Include inside the app.nata-info.ru server block. The application download
# route supports ordinary GMIB/GGS products only; serve clone images separately.
location ^~ /downloads/gmib-kiosk-clone/ {
    alias /home/user/src/app-server/public/downloads/gmib-kiosk-clone/;
    autoindex off;
    default_type application/octet-stream;
    # Do not expose partial uploads, arbitrary files, or directory listings.
    if ($uri !~ "^/downloads/gmib-kiosk-clone/gmib-kiosk-[0-9A-Za-z.-]+-clone[0-9][a-z0-9.-]*-ubuntu-[0-9.]+-amd64\.iso(?:\.sha256|\.json)?$") {
        return 404;
    }
    limit_except GET { deny all; }
    add_header Cache-Control "public, max-age=300";
}
